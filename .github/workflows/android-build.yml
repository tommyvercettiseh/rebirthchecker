name: Android APK Build

on:
  push:
    paths:
      - 'android_project.tar.gz.b64'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore Android project
        run: |
          base64 -d android_project.tar.gz.b64 > android_project.tar.gz
          tar -xzf android_project.tar.gz

      - name: Add map images
        run: |
          mkdir -p rebirth_android/app/src/main/res/drawable rebirth_android/widget/src/main/res/drawable
          curl -L --fail --connect-timeout 10 --max-time 45 'https://www.gamereactor.eu/media/95/activisionhasshared_3809583b.jpg' -o /tmp/fortunes_keep.jpg
          curl -L --fail --connect-timeout 10 --max-time 45 'https://areajugones.sport.es/wp-content/uploads/2024/03/rebirth-island-warzone.jpg' -o /tmp/rebirth_island.jpg
          curl -L --fail --connect-timeout 10 --max-time 45 'https://pbs.twimg.com/media/G8jcDuybEAAn9w0.jpg' -o /tmp/havens_hollow.jpg
          for module in app widget; do
            cp /tmp/fortunes_keep.jpg rebirth_android/$module/src/main/res/drawable/fortunes_keep.jpg
            cp /tmp/rebirth_island.jpg rebirth_android/$module/src/main/res/drawable/rebirth_island.jpg
            cp /tmp/havens_hollow.jpg rebirth_android/$module/src/main/res/drawable/havens_hollow.jpg
          done

      - name: Build APKs
        run: gradle -p rebirth_android :app:assembleDebug :widget:assembleDebug --stacktrace

      - name: Rename APKs
        run: |
          cp rebirth_android/app/build/outputs/apk/debug/app-debug.apk Rebirth-Checker-Android.apk
          cp rebirth_android/widget/build/outputs/apk/debug/widget-debug.apk Rebirth-Rotation-Widget.apk

      - name: Upload app APK
        uses: actions/upload-artifact@v4
        with:
          name: Rebirth-Checker-Android
          path: Rebirth-Checker-Android.apk

      - name: Upload widget APK
        uses: actions/upload-artifact@v4
        with:
          name: Rebirth-Rotation-Widget
          path: Rebirth-Rotation-Widget.apk
