name: Rebirth Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-widget.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build test APK
        working-directory: android
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Rebirth-Checker-v0.5.0-test.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rebirth-Checker-v0.5.0-test
          path: Rebirth-Checker-v0.5.0-test.apk
          if-no-files-found: error
          retention-days: 30
