name: Android APK Safe Build

on:
  push:
    paths:
      - '.github/workflows/android-build-safe.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore Android project
        run: |
          git show 78a4fed39a51bc230f58f6c893537b7ce55d218e:android_project.tar.gz.b64 | base64 -d > android_project.tar.gz
          tar -xzf android_project.tar.gz

      - name: Patch stable live toggle
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path('rebirth_android/app/src/main')
          main = root / 'java/com/hes/rebirthchecker/MainActivity.java'
          s = main.read_text()

          s = s.replace(
              '            c.clipRoundRect(card, 24f, 24f);',
              '            android.graphics.Path clip = new android.graphics.Path();\n'
              '            clip.addRoundRect(card, 24f, 24f, android.graphics.Path.Direction.CW);\n'
              '            c.clipPath(clip);'
          )

          s = s.replace('        private int remaining;\n', '        private int remaining;\n        private boolean liveAlerts;\n        private int lastNotifiedIndex = -1;\n')
          s = s.replace('            running = prefs.getBoolean("running", true);\n', '            running = prefs.getBoolean("running", true);\n            liveAlerts = prefs.getBoolean("liveAlerts", false);\n')

          old_loop = '''                    while (now >= endElapsed) {\n                        index = (index + 1) % MAPS.length;\n                        endElapsed += DURATION * 1000L;\n                    }'''
          new_loop = '''                    while (now >= endElapsed) {\n                        index = (index + 1) % MAPS.length;\n                        endElapsed += DURATION * 1000L;\n                        if (liveAlerts && index == 1 && lastNotifiedIndex != index) {\n                            showRebirthNotification();\n                            lastNotifiedIndex = index;\n                        }\n                        if (index != 1) lastNotifiedIndex = -1;\n                    }'''
          if old_loop not in s: raise SystemExit('loop target missing')
          s = s.replace(old_loop, new_loop)

          old_draw = '''            p.setTextAlign(Paint.Align.CENTER);\n            text(c, "Tik links/rechts = vorige/volgende • midden = pauze", w/2f, top + cardH + 36f, 12f, 0xFF9AA6AD, false);\n            p.setTextAlign(Paint.Align.LEFT);'''
          new_draw = '''            p.setTextAlign(Paint.Align.CENTER);\n            text(c, "Tik links/rechts = vorige/volgende • midden = pauze", w/2f, top + cardH + 34f, 12f, 0xFF9AA6AD, false);\n            float liveY = top + cardH + 78f;\n            text(c, "LIVE SPELEN", w/2f - 58f, liveY + 5f, 12f, liveAlerts ? Color.rgb(139,232,63) : 0xFF9AA6AD, true);\n            float sx = w/2f + 22f;\n            RectF toggleRect = new RectF(sx, liveY - 15f, sx + 54f, liveY + 15f);\n            p.setColor(liveAlerts ? Color.rgb(70,130,36) : Color.rgb(48,58,64));\n            c.drawRoundRect(toggleRect, 18f, 18f, p);\n            p.setColor(liveAlerts ? Color.rgb(139,232,63) : Color.rgb(145,155,162));\n            c.drawCircle(liveAlerts ? sx + 39f : sx + 15f, liveY, 11f, p);\n            text(c, liveAlerts ? "Rebirth meldingen AAN" : "Geen meldingen", w/2f, liveY + 34f, 10f, liveAlerts ? Color.rgb(139,232,63) : 0xFF7E8A91, false);\n            p.setTextAlign(Paint.Align.LEFT);'''
          if old_draw not in s: raise SystemExit('draw target missing')
          s = s.replace(old_draw, new_draw)

          old_touch = '''        @Override public boolean onTouchEvent(MotionEvent e) {\n            if (e.getAction()!=MotionEvent.ACTION_UP) return true;\n            float x=e.getX()/getWidth();\n            if (x < .33f) skip(-1); else if (x > .67f) skip(1); else toggle();\n            return true;\n        }'''
          new_touch = '''        @Override public boolean onTouchEvent(MotionEvent e) {\n            if (e.getAction()!=MotionEvent.ACTION_UP) return true;\n            float cardW = getWidth() * 0.94f;\n            float cardH = cardW * 265f / 470f;\n            float top = Math.max(28f, (getHeight() - cardH) / 2f);\n            float liveY = top + cardH + 78f;\n            if (Math.abs(e.getY() - liveY) <= 34f) { toggleLiveAlerts(); return true; }\n            float x=e.getX()/getWidth();\n            if (x < .33f) skip(-1); else if (x > .67f) skip(1); else toggle();\n            return true;\n        }'''
          if old_touch not in s: raise SystemExit('touch target missing')
          s = s.replace(old_touch, new_touch)

          marker = '        private void skip(int d) {\n'
          methods = '''        private void toggleLiveAlerts() {\n            liveAlerts = !liveAlerts;\n            prefs.edit().putBoolean("liveAlerts", liveAlerts).apply();\n            if (liveAlerts && android.os.Build.VERSION.SDK_INT >= 33 && getContext().checkSelfPermission(android.Manifest.permission.POST_NOTIFICATIONS) != android.content.pm.PackageManager.PERMISSION_GRANTED) {\n                ((android.app.Activity)getContext()).requestPermissions(new String[]{android.Manifest.permission.POST_NOTIFICATIONS}, 901);\n            }\n            if (liveAlerts && index == 1) showRebirthNotification();\n            Toast.makeText(getContext(), liveAlerts ? "Live spelen aan • Rebirth meldingen aan" : "Live spelen uit • geen meldingen", Toast.LENGTH_SHORT).show();\n            invalidate();\n        }\n\n        private void showRebirthNotification() {\n            if (!liveAlerts) return;\n            if (android.os.Build.VERSION.SDK_INT >= 33 && getContext().checkSelfPermission(android.Manifest.permission.POST_NOTIFICATIONS) != android.content.pm.PackageManager.PERMISSION_GRANTED) return;\n            android.app.NotificationManager nm = (android.app.NotificationManager)getContext().getSystemService(android.content.Context.NOTIFICATION_SERVICE);\n            if (nm == null) return;\n            String channelId = "rebirth_live";\n            if (android.os.Build.VERSION.SDK_INT >= 26) nm.createNotificationChannel(new android.app.NotificationChannel(channelId, "Rebirth live meldingen", android.app.NotificationManager.IMPORTANCE_HIGH));\n            android.app.Notification.Builder b = android.os.Build.VERSION.SDK_INT >= 26 ? new android.app.Notification.Builder(getContext(), channelId) : new android.app.Notification.Builder(getContext());\n            b.setSmallIcon(android.R.drawable.star_big_on)\n             .setContentTitle("Rebirth Island is live!")\n             .setContentText("Rebirth Island is nu actief. Tijd om te joinen.")\n             .setAutoCancel(true)\n             .setPriority(android.app.Notification.PRIORITY_HIGH)\n             .setDefaults(android.app.Notification.DEFAULT_ALL);\n            nm.notify(77, b.build());\n        }\n\n'''
          if marker not in s: raise SystemExit('method marker missing')
          s = s.replace(marker, methods + marker)
          main.write_text(s)

          manifest = root / 'AndroidManifest.xml'
          m = manifest.read_text()
          m = m.replace('<manifest xmlns:android="http://schemas.android.com/apk/res/android">', '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>')
          manifest.write_text(m)
          PY

      - name: Add map images
        run: |
          mkdir -p rebirth_android/app/src/main/res/drawable rebirth_android/widget/src/main/res/drawable
          curl -L --fail 'https://www.gamereactor.eu/media/95/activisionhasshared_3809583b.jpg' -o /tmp/fortunes_keep.jpg
          curl -L --fail 'https://areajugones.sport.es/wp-content/uploads/2024/03/rebirth-island-warzone.jpg' -o /tmp/rebirth_island.jpg
          curl -L --fail 'https://pbs.twimg.com/media/G8jcDuybEAAn9w0.jpg' -o /tmp/havens_hollow.jpg
          for module in app widget; do
            cp /tmp/fortunes_keep.jpg rebirth_android/$module/src/main/res/drawable/fortunes_keep.jpg
            cp /tmp/rebirth_island.jpg rebirth_android/$module/src/main/res/drawable/rebirth_island.jpg
            cp /tmp/havens_hollow.jpg rebirth_android/$module/src/main/res/drawable/havens_hollow.jpg
          done

      - name: Build APKs
        run: gradle -p rebirth_android :app:assembleDebug :widget:assembleDebug --stacktrace

      - name: Rename APKs
        run: |
          cp rebirth_android/app/build/outputs/apk/debug/app-debug.apk Rebirth-Checker-Android-Stable.apk
          cp rebirth_android/widget/build/outputs/apk/debug/widget-debug.apk Rebirth-Rotation-Widget.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Rebirth-Checker-Android-Stable
          path: Rebirth-Checker-Android-Stable.apk
