name: Patch Rebirth web rotation

on:
  push:
    paths:
      - ".github/workflows/inspect-web-rotation.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reorder maps only
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path("web/index.html")
          text = p.read_text(encoding="utf-8")

          timer_pattern = re.compile(
              r"const duration = 10 \* 60;\s*"
              r"const anchorIndex = 0;\s*"
              r"const initialRemaining = 7 \* 60 \+ 42;\s*"
              r"const anchorEpoch = Date\.now\(\) - \(duration - initialRemaining\) \* 1000;"
          )
          timer_before = timer_pattern.search(text)
          if not timer_before:
              raise SystemExit("Timer block not found; refusing to modify.")

          maps_match = re.search(r"const maps = \[(.*?)\];", text, flags=re.S)
          if not maps_match:
              raise SystemExit("Maps array not found.")

          body = maps_match.group(1)
          entry_pattern = re.compile(
              r"\{\s*name:\s*\"([^\"]+)\",\s*image:\s*\x60.*?\x60\s*\}",
              flags=re.S
          )
          entries = [(m.group(1), m.group(0)) for m in entry_pattern.finditer(body)]
          if len(entries) != 3:
              raise SystemExit(f"Expected exactly 3 map entries, found {len(entries)}")

          by_name = {name: block for name, block in entries}
          desired = ["FORTUNE'S KEEP", "REBIRTH ISLAND", "HAVEN'S HOLLOW"]
          if set(by_name) != set(desired):
              raise SystemExit(f"Unexpected map names: {list(by_name)}")

          new_body = "\n  " + ",\n  ".join(by_name[name] for name in desired) + "\n"
          new_text = text[:maps_match.start(1)] + new_body + text[maps_match.end(1):]

          timer_after = timer_pattern.search(new_text)
          if not timer_after or timer_before.group(0) != timer_after.group(0):
              raise SystemExit("Timer block changed; refusing to write.")

          p.write_text(new_text, encoding="utf-8")
          print("Rotation changed to: Fortune's Keep -> Rebirth Island -> Haven's Hollow")
          print("Timer block preserved exactly.")

      - name: Commit rotation fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/index.html
          git commit -m "fix: update Rebirth web map rotation"
          git push
